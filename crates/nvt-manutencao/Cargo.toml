[package]
name = "nvt-manutencao"
description = "Limpeza segura de temporários (biblioteca pura + adaptador Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
nvt-ipc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[features]
# Só ligada por `medicao-partidas` de serviço e agente (D2, D9); trava em build.rs.
build-de-teste = []

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Ioctl"] }
