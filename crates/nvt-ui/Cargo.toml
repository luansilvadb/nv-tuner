[package]
name = "nvt-ui"
description = "Interface do nv-tuner (sem privilégios de administrador)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
nvt-ipc.workspace = true
# Modo de visualização (sem serviço): pipeline local somente leitura.
nvt-core = { path = "../nvt-core" }
nvt-detect = { path = "../nvt-detect" }
nvt-drs = { path = "../nvt-drs" }
nvt-engine = { path = "../nvt-engine" }
# GPUI + gpui-component (ver docs/pesquisa/gpui-windows.md). Versão exata:
# gpui-kit 0.11.0 fixa gpui-pre =0.3.14.
gpui-kit = "=0.11.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_Time"] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

[features]
# Gravação de partidas (build de teste; spec interface-e-saude.md D1). Vazia
# no L1: só declara a feature para os `#[cfg]` da UI.
medicao-partidas = []
