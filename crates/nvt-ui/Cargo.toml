[package]
name = "nvt-ui"
description = "Interface do nv-tuner (sem privilégios de administrador)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
nvt-ipc.workspace = true
# Modo de visualização (sem serviço): pipeline local somente leitura.
nvt-core.workspace = true
nvt-drs.workspace = true
nvt-engine.workspace = true
# GPUI + gpui-component (ver docs/pesquisa/gpui-windows.md). Versão exata:
# gpui-kit 0.11.0 fixa gpui-pre =0.3.14.
gpui-kit = "=0.11.0"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[features]
# Gravação de partidas (build de teste; spec interface-e-saude.md D1). Vazia
# no L1: só declara a feature para os `#[cfg]` da UI.
medicao-partidas = []
