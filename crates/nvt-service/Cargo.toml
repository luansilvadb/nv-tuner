[package]
name = "nvt-service"
description = "Serviço do Windows (privilegiado) que aplica planos de configuração"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Só para o laboratório (U-15a): URL base e chave de ensaio; nunca em release.
laboratorio = ["nvt-atualizacao/laboratorio"]
# Build de teste (D2, D9): limpeza em `Simulacao`; trava em nvt-manutencao/build.rs.
# Só ligada por `medicao-partidas` (Q11: um único build de teste).
build-de-teste = ["nvt-manutencao/build-de-teste"]
# Build de teste (§4.5, §8.4, D9): gravação de partidas + dry-run da limpeza.
medicao-partidas = ["dep:nvt-medicao", "nvt-medicao/medicao-partidas", "build-de-teste"]

[dependencies]
nvt-ipc.workspace = true
nvt-core = { path = "../nvt-core" }
nvt-drs = { path = "../nvt-drs" }
nvt-windows = { path = "../nvt-windows" }
nvt-engine = { path = "../nvt-engine" }
nvt-atualizacao = { path = "../nvt-atualizacao" }
nvt-manutencao = { path = "../nvt-manutencao" }
nvt-medicao = { path = "../nvt-medicao", optional = true }
serde.workspace = true
toml = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "registry"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_UI_Shell",
] }

[dev-dependencies]
minisign = "=0.7.9"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
embed-resource = "3"

[lints]
workspace = true
