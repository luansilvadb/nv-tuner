[package]
name = "nvt-agente"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "nvt-agente"
path = "src/main.rs"

[dependencies]
nvt-ipc.workspace = true
nvt-core.workspace = true
nvt-detect.workspace = true
nvt-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
nvt-jogocfg = { path = "../nvt-jogocfg" }
nvt-manutencao.workspace = true
nvt-windows.workspace = true
winreg.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Repassa o dry-run da limpeza (D2, D9); trava no build.rs de nvt-manutencao.
build-de-teste = ["nvt-manutencao/build-de-teste"]
# Build de teste (Q11/D9): o agente não grava partidas; só liga o dry-run da limpeza.
medicao-partidas = ["build-de-teste"]

[lints]
workspace = true
