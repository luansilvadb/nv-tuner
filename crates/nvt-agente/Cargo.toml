[package]
name = "nvt-agente"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "nvt-agente"
path = "src/main.rs"

[dependencies]
nvt-ipc.workspace = true
nvt-core = { path = "../nvt-core" }
nvt-detect = { path = "../nvt-detect" }
nvt-engine = { path = "../nvt-engine" }
serde.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[lints]
workspace = true
