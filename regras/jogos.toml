# Base curada de jogos competitivos do nv-tuner.
# Formato e semântica: docs/spec/competitivo.md §7.3.
#
# Campos:
#   id                   kebab-case, único
#   executaveis          nomes de exe (comparação sem diferenciar maiúsculas)
#   steam_appid          opcional; se informado pelo chamador e diferente, não casa
#   anticheat            vac | vanguard | eac | battleye | eac_battleye | ricochet
#                        | blizzard | netease | proprio
#   processos_protegidos processos vigiados além dos executáveis
#   config               edicao | opcoes_inicializacao | orientar | proibido (fase 3)
#   orientacoes          códigos de §7.3 (o texto fica na UI)
#
# Schema 2 (fase 3, docs/spec/fase3-plano.md): [[arquivo]] lista os arquivos de
# configuração do usuário que o agente pode editar, com cada chave e os valores
# ou a faixa do menu (F3-02). Chave `a_confirmar = true` nunca é gravada: a
# carga recusa regra que a use. [[regra]] (escopo config_jogo) são todas
# experimentais (D9) e só valem com Aceitar. Jogos com config orientar/proibido
# não podem ter [[arquivo]] nem regra (erro de carga). Pesquisa e fontes:
# docs/pesquisa/fase3-confirmacoes.md.
#
# Itens marcados com "# a confirmar" estão por verificar em máquina real (§11).

versao_schema = 2

[[jogo]]
id = "cs2"
nome = "Counter-Strike 2"
executaveis = ["cs2.exe"]
steam_appid = 730
reflex = true
limitador_nativo = true                      # fps_max
anticheat = "vac"
anticheat_kernel = false
processos_protegidos = []
config = "edicao"
orientacoes = ["reflex_on_boost", "limitador_do_jogo", "tela_cheia", "vsync_jogo_off"]
