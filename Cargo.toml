[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["nv-tuner contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
nvt-ipc = { path = "crates/nvt-ipc" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
